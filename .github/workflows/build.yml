name: Verify and build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
      - run: go vet ./... && go test -race ./...
      - run: node --check web/app.js
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: test -f "$ANDROID_HOME/platforms/android-35/android.jar"
      - run: gradle --no-daemon -p android lintDebug assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: remote-music-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Build signed release when configured
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          APK_KEYSTORE_BASE64: ${{ secrets.APK_KEYSTORE_BASE64 }}
          APK_STORE_PASSWORD: ${{ secrets.APK_STORE_PASSWORD }}
          APK_KEY_ALIAS: ${{ secrets.APK_KEY_ALIAS }}
          APK_KEY_PASSWORD: ${{ secrets.APK_KEY_PASSWORD }}
        run: |
          if [ -z "$APK_KEYSTORE_BASE64" ]; then exit 0; fi
          export APK_KEYSTORE="$RUNNER_TEMP/music-release.jks"
          trap 'rm -f "$APK_KEYSTORE"' EXIT
          umask 077
          printf '%s' "$APK_KEYSTORE_BASE64" | base64 -d > "$APK_KEYSTORE"
          gradle --no-daemon -p android assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: remote-music-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: ignore
  docker:
    needs: [server, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/sora3qwq/music-player:main,ghcr.io/sora3qwq/music-player:${{ github.sha }}
