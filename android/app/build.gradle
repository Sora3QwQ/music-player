plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
android {
    namespace 'com.sora.music'
    compileSdk 35
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    defaultConfig {
        applicationId 'com.sora.music'
        minSdk 28
        targetSdk 35
        versionCode 3
        versionName '0.2.0'
    }
    signingConfigs {
        ci {
            if (System.getenv('APK_KEYSTORE')) {
                storeFile file(System.getenv('APK_KEYSTORE'))
                storePassword System.getenv('APK_STORE_PASSWORD')
                keyAlias System.getenv('APK_KEY_ALIAS')
                keyPassword System.getenv('APK_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            if (System.getenv('APK_KEYSTORE')) signingConfig signingConfigs.ci
        }
    }
}
dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    testImplementation 'junit:junit:4.13.2'
}
