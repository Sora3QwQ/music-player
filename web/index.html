<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101b17">
  <title>远程音乐</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
<main>
  <header class="masthead">
    <div class="brand"><span class="brand-mark" aria-hidden="true">♫</span><div><strong>远程音乐</strong><span>LOCAL PLAYER</span></div></div>
    <p id="notice" role="status"></p>
  </header>
  <form id="login" class="login panel" hidden>
    <p class="eyebrow">PRIVATE LISTENING</p>
    <h1>打开你的音乐房间</h1>
    <p class="muted">登录后，用这个浏览器控制安卓播放机。</p>
    <label for="password">管理员密码</label>
    <input id="password" type="password" autocomplete="current-password" required>
    <button class="primary">进入控制台</button>
  </form>
  <div id="player" class="dashboard" hidden>
    <section class="now panel" aria-label="正在播放">
      <div class="row spread"><p class="eyebrow">NOW PLAYING</p><strong id="online" class="badge"></strong></div>
      <div class="record" aria-hidden="true"><span>♫</span></div>
      <h1 id="track">等待点歌</h1>
      <div class="timeline"><input id="seek" aria-label="播放进度" type="range" min="0" value="0" max="0"><output id="time">0:00 / 0:00</output></div>
      <div class="transport">
        <button data-action="previous" aria-label="上一首" title="上一首">⏮</button>
        <button data-action="play" class="primary" aria-label="播放" title="播放">▶</button>
        <button data-action="pause" aria-label="暂停" title="暂停">Ⅱ</button>
        <button data-action="next" aria-label="下一首" title="下一首">⏭</button>
      </div>
      <label class="volume">音量 <input id="volume" type="range" min="0" max="100" value="100"></label>
    </section>
    <section class="library panel">
      <div class="row spread"><div><p class="eyebrow">LIBRARY</p><h2>本地曲库</h2></div><span id="track-count" class="muted"></span></div>
      <input id="search" type="search" placeholder="搜索歌曲" aria-label="搜索歌曲">
      <p id="library-empty" class="muted" hidden></p>
      <ul id="tracks"></ul>
    </section>
    <section class="queue panel">
      <div class="row spread"><div><p class="eyebrow">UP NEXT</p><h2>接下来播放</h2></div><button id="clear-queue" data-action="clearQueue">清空队列</button></div>
      <p id="queue-empty" class="muted">队列为空。可以从曲库加入歌曲。</p>
      <ol id="queue"></ol>
    </section>
    <section class="device panel">
      <div class="row spread"><div><p class="eyebrow">DEVICE</p><h2>设备管理</h2></div><button id="logout">退出登录</button></div>
      <div class="row device-actions"><button id="pair">生成配对码</button><button id="revoke">解绑设备</button></div>
      <input id="code" readonly hidden aria-label="配对码">
    </section>
  </div>
</main>
</body>
</html>
