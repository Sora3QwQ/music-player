<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>远程音乐</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body><main>
<header><p class="eyebrow">LOCAL MUSIC · REMOTE CONTROL</p><h1>远程音乐</h1><p id="notice" role="status"></p></header>
<form id="login" hidden><label>管理员密码 <input id="password" type="password" autocomplete="current-password" required></label><button>登录</button></form>
<div id="player" hidden>
<section><div class="bar"><strong id="online"></strong><button id="logout">退出</button></div>
<h2 id="track">等待点歌</h2>
<label>进度 <input id="seek" type="range" min="0" value="0" max="0"><output id="time"></output></label>
<div class="bar controls"><button data-action="previous">上一首</button><button data-action="play">播放</button><button data-action="pause">暂停</button><button data-action="next">下一首</button></div>
<label>音量 <input id="volume" type="range" min="0" max="100" value="100"></label></section>
<section><div class="bar"><h2>本地曲库</h2><input id="search" type="search" placeholder="搜索歌曲或歌手" aria-label="搜索歌曲或歌手"></div><ul id="tracks"></ul></section>
<section><div class="bar"><h2>设备管理</h2><button id="pair">生成配对码</button><button id="revoke">解绑</button></div><input id="code" readonly hidden aria-label="配对码"></section>
</div></main></body></html>
