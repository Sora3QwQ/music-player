services:
  app:
    image: ${MUSIC_IMAGE:-ghcr.io/sora3qwq/music-player:main}
    environment:
      PUBLIC_ORIGIN: https://${MUSIC_DOMAIN:?set MUSIC_DOMAIN}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD}
    ports:
      - "127.0.0.1:${MUSIC_PORT:-8080}:8080"
    volumes:
      - music-data:/data
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
volumes:
  music-data:
